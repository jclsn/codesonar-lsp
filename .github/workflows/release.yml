# Builds codesonar-lsp for Linux and Windows, with Debian and RPM packages,
# and publishes them as a GitHub release. Runs when a version tag like v0.1.0 is pushed; started
# by hand from the Actions tab, it only builds, without a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Publishing needs write access, so the actions are pinned to commits: a
# moved tag cannot change what runs with it.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # A release of version 0.1.0 is tagged v0.1.0.
      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi

      # Known vulnerabilities of the dependencies, from the RustSec database.
      - name: Audit the dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: test
    strategy:
      matrix:
        include:
          # Static, so it runs on any Linux, whatever its glibc.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Pack the binary
        shell: bash
        run: |
          name="codesonar-lsp-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp "target/${{ matrix.target }}/release/codesonar-lsp.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/codesonar-lsp" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi

      # From the static binary, so that one package fits every release of
      # the distributions; the metadata is in Cargo.toml.
      - name: Build the Debian and RPM packages
        if: contains(matrix.target, 'musl')
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb --no-build --target ${{ matrix.target }} --output ./
          cargo generate-rpm --target ${{ matrix.target }} --output ./

      # The oldest and newest supported releases; the server ends when its
      # input does.
      - name: Install the packages
        if: contains(matrix.target, 'musl')
        run: |
          for image in debian:11 debian:13 ubuntu:20.04 ubuntu:24.04; do
            docker run --rm -v "$PWD:/pkg" "$image" \
              sh -c 'dpkg -i /pkg/codesonar-lsp_*.deb && codesonar-lsp < /dev/null'
          done
          for image in almalinux:8 almalinux:10; do
            docker run --rm -v "$PWD:/pkg" "$image" \
              sh -c 'rpm -i /pkg/codesonar-lsp-*.rpm && codesonar-lsp < /dev/null'
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            codesonar-lsp-*.${{ matrix.archive }}
            codesonar-lsp*.deb
            codesonar-lsp*.rpm

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum codesonar-lsp* > SHA256SUMS

          # A tag moved to another commit, or a run again, publishes into the
          # release it has already, replacing its files.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              codesonar-lsp* SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes \
              codesonar-lsp* SHA256SUMS
          fi
