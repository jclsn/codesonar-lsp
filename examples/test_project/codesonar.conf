# BEGIN codesonar-lsp: written by codesonar-lsp, e.g. :CodeSonarPresets
# codesonar-lsp: project = /test_project
# codesonar-lsp: build = make -B                 # full rebuild, for the first analysis
# codesonar-lsp: incremental-build = make        # what changed, for later analyses
# END codesonar-lsp
HUB_ADDRESS = 192.168.184.28:7340

# CodeSonar settings of the test project, read after the project
# configuration in .codesonar/project.conf. codesonar-lsp passes this file
# with -conf-file. The section above names the hub project and the build
# commands, for which CodeSonar has no settings of its own.

# Each analysis is an incremental child of the previous one, so it only
# needs the compilations that changed since then: codesonar-lsp builds
# with the incremental build command instead of a full rebuild.
INCREMENTAL_BUILD = Yes
