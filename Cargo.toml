[package]
name = "codesonar-lsp"
version = "0.1.0"
edition = "2024"
description = "Language server for CodeSonar static analysis warnings"
license = "MIT"

[dependencies]
anyhow = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync", "fs"] }
tower-lsp = "0.20"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
